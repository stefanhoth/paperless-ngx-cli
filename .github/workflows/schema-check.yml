name: Schema Drift Check

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

concurrency:
  group: schema-check
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      tracked: ${{ steps.tracked.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get latest Paperless-NGX release
        id: upstream
        run: |
          version=$(curl -sf https://api.github.com/repos/paperless-ngx/paperless-ngx/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read tracked version
        id: tracked
        run: echo "version=$(cat .paperless-version)" >> "$GITHUB_OUTPUT"

      - name: Build the walk from tracked to upstream
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED: ${{ steps.tracked.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          echo "Tracked: ${TRACKED}  /  Upstream: ${UPSTREAM}"
          if [ "${TRACKED}" = "${UPSTREAM}" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api repos/paperless-ngx/paperless-ngx/releases --paginate > /tmp/releases.json
          python3 scripts/paperless_versions.py matrix \
            --releases /tmp/releases.json --tracked "${TRACKED}" --upstream "${UPSTREAM}" \
            > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          count=$(python3 -c "import json; print(len(json.load(open('/tmp/matrix.json'))['include']))")
          echo "has_matrix=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Once .paperless-version moves past a release, any still-open issue
      # about it is moot — close it rather than letting it nag forever.
      - name: Close issues for versions already caught up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED: ${{ steps.tracked.outputs.version }}
        run: |
          gh issue list --label "schema-drift" --state open --json number,title \
            --jq '.[] | [.number, .title] | @tsv' > /tmp/open-issues.tsv || touch /tmp/open-issues.tsv
          while IFS=$'\t' read -r number title; do
            [ -z "$number" ] && continue
            issue_version=$(echo "$title" | grep -oP 'v\d+\.\d+\.\d+' | head -1) || true
            [ -z "$issue_version" ] && continue
            cmp=$(python3 scripts/paperless_versions.py cmp "$issue_version" "$TRACKED") || continue
            if [ "$cmp" -le 0 ]; then
              gh issue close "$number" \
                --comment "Tracked version has reached or passed \`${issue_version}\`. Closing."
            fi
          done < /tmp/open-issues.tsv

  process:
    needs: plan
    if: needs.plan.outputs.has_matrix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Skip if an open issue already covers this version
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
        run: |
          gh issue list --label "schema-drift" --state open --json number,title \
            --jq '.[] | [.number, .title] | @tsv' > /tmp/open-issues.tsv || touch /tmp/open-issues.tsv
          number=""
          while IFS=$'\t' read -r candidate title; do
            [ -z "$candidate" ] && continue
            case "$title" in
              *"$VERSION"*) number="$candidate" ;;
            esac
          done < /tmp/open-issues.tsv
          if [ -n "$number" ]; then
            gh issue comment "$number" \
              --body "Still unresolved as of $(date -u +%Y-%m-%d)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.existing.outputs.skip == 'false'
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate the previous version's schema (diff base)
        id: prev_schema
        if: steps.existing.outputs.skip == 'false'
        env:
          PREV_VERSION: ${{ matrix.prev_version }}
          TRACKED: ${{ needs.plan.outputs.tracked }}
        run: |
          if [ "${PREV_VERSION}" = "${TRACKED}" ]; then
            # Already the committed, patched schema — no need to regenerate it.
            cp schema/paperless.json /tmp/prev-schema-patched.json
          else
            IMAGE_TAG="${PREV_VERSION#v}"
            docker pull "ghcr.io/paperless-ngx/paperless-ngx:${IMAGE_TAG}"
            docker run --rm \
              --entrypoint python3 \
              -e PAPERLESS_SECRET_KEY=changeme \
              -e PAPERLESS_DBENGINE=sqlite \
              "ghcr.io/paperless-ngx/paperless-ngx:${IMAGE_TAG}" \
              /usr/src/paperless/src/manage.py spectacular \
                --file /dev/stdout --format openapi-json 2>/dev/null \
              > /tmp/prev-schema-raw.json
            python3 scripts/fix-schema.py \
              --input /tmp/prev-schema-raw.json --output /tmp/prev-schema-patched.json
          fi
          python3 -m json.tool /tmp/prev-schema-patched.json > /tmp/prev-schema-pretty.json

      - name: Generate this version's schema
        id: this_schema
        if: steps.existing.outputs.skip == 'false'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          IMAGE_TAG="${VERSION#v}"
          docker pull "ghcr.io/paperless-ngx/paperless-ngx:${IMAGE_TAG}"
          docker run --rm \
            --entrypoint python3 \
            -e PAPERLESS_SECRET_KEY=changeme \
            -e PAPERLESS_DBENGINE=sqlite \
            "ghcr.io/paperless-ngx/paperless-ngx:${IMAGE_TAG}" \
            /usr/src/paperless/src/manage.py spectacular \
              --file /dev/stdout --format openapi-json 2>/dev/null \
            > /tmp/this-schema-raw.json
          python3 scripts/fix-schema.py \
            --input /tmp/this-schema-raw.json --output /tmp/this-schema-patched.json
          python3 -m json.tool /tmp/this-schema-patched.json > /tmp/this-schema-pretty.json

      - name: Diff against the previous release
        id: diff
        if: steps.existing.outputs.skip == 'false'
        run: |
          diff -u /tmp/prev-schema-pretty.json /tmp/this-schema-pretty.json \
            > /tmp/schema-diff.txt || true
          if [ -s /tmp/schema-diff.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the client and push a branch for this version
        id: branch
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          cp /tmp/this-schema-patched.json schema/paperless.json
          echo "${VERSION}" > .paperless-version
          # Keep the generator version in sync with the Makefile's own pin
          # rather than duplicating it here.
          OAPI_CODEGEN=$(grep -oP '(?<=OAPI_CODEGEN := ).*' Makefile)
          ${OAPI_CODEGEN} --config oapi-codegen.yaml schema/paperless.json

          branch="schema-drift/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add schema/paperless.json api/paperless.gen.go .paperless-version
          git commit -m "chore: regenerate client for Paperless-NGX ${VERSION}" \
            -m "Auto-generated by the schema-drift workflow. See the linked issue for the schema diff against the previous tracked release."
          git push origin "$branch" --force
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ matrix.version }}
          PREV_VERSION: ${{ matrix.prev_version }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          DIFF_FILE: /tmp/schema-diff.txt
        run: python3 scripts/build-issue-body.py

      - name: Create issue
        if: steps.existing.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
        run: |
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr -cd '[:alnum:] ._()-')
          gh issue create \
            --title "New Paperless-NGX release: ${SAFE_VERSION}" \
            --body-file /tmp/issue-body.md \
            --label "schema-drift"
