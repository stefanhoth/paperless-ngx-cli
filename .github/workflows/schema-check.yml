name: Schema Drift Check

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

concurrency:
  group: schema-check
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get tracked and upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "tracked=$(cat .paperless-version)" >> "$GITHUB_OUTPUT"
          gh api repos/paperless-ngx/paperless-ngx/releases --paginate > /tmp/releases.json
          upstream=$(python3 scripts/paperless_versions.py latest --releases /tmp/releases.json)
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"

      # Once .paperless-version moves past a release, any still-open issue
      # about it is moot — close it rather than letting it nag forever.
      - name: Close issues for versions already caught up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED: ${{ steps.versions.outputs.tracked }}
        run: |
          gh issue list --label "schema-drift" --state open --limit 200 --json number,title \
            --jq '.[] | [.number, .title] | @tsv' > /tmp/open-issues.tsv || touch /tmp/open-issues.tsv
          while IFS=$'\t' read -r number title; do
            [ -z "$number" ] && continue
            issue_version=$(echo "$title" | grep -oP 'v\d+\.\d+\.\d+' | head -1) || true
            [ -z "$issue_version" ] && continue
            cmp=$(python3 scripts/paperless_versions.py cmp "$issue_version" "$TRACKED") || continue
            if [ "$cmp" -le 0 ]; then
              gh issue close "$number" \
                --comment "Tracked version has reached or passed \`${issue_version}\`. Closing."
            fi
          done < /tmp/open-issues.tsv

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.versions.outputs.tracked != steps.versions.outputs.upstream
        with:
          go-version-file: go.mod
          cache: true

      # Paperless release images are immutable, so a regenerated schema for a
      # given version never changes — cache it across runs so a daily cron
      # with a stuck/unresolved intermediate version doesn't re-pull and
      # re-run spectacular for the same versions every single day.
      #
      # Split into restore+save (rather than the combined `actions/cache`)
      # so the save still runs under `if: always()` below: the combined
      # action only saves on a successful job, so a run that dies partway
      # through the walk (e.g. one bad upstream image) would silently lose
      # every version it already generated, and re-pull them all again
      # tomorrow — the exact per-day repeat problem this cache exists to
      # avoid. Keyed with run_id (falling back via restore-keys) because a
      # static key would restore fine but, since a save is skipped whenever
      # the key already exists, would never pick up a run's new entries.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: schema-cache
        if: steps.versions.outputs.tracked != steps.versions.outputs.upstream
        with:
          path: /tmp/schema-cache
          key: schema-cache-${{ hashFiles('scripts/fix-schema.py') }}-${{ github.run_id }}
          restore-keys: |
            schema-cache-${{ hashFiles('scripts/fix-schema.py') }}-

      # Walks every release between tracked and upstream, diffing each one
      # against the release immediately before it (never the original
      # tracked base) in a single pass, so each version's schema is
      # generated at most once per run regardless of how many releases are
      # in the walk. Deliberately sequential, not a matrix: this is a daily,
      # non-urgent, already-serialized (see concurrency: above) job over a
      # handful of releases, so the parallelism a matrix would buy isn't
      # worth paying for in duplicated Docker pulls.
      - name: Walk every release between tracked and upstream
        if: steps.versions.outputs.tracked != steps.versions.outputs.upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED: ${{ steps.versions.outputs.tracked }}
          UPSTREAM: ${{ steps.versions.outputs.upstream }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          mkdir -p /tmp/schema-cache
          OAPI_CODEGEN=$(grep -oP '(?<=OAPI_CODEGEN := ).*' Makefile)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # gen_schema VERSION OUT_FILE — fills OUT_FILE with VERSION's
          # patched schema, from the cache if a prior run already did this,
          # otherwise from a fresh Docker pull + spectacular + fix-schema.
          gen_schema() {
            local version="$1" out="$2"
            if [ -s "$out" ]; then
              echo "  (cached) ${version}"
              return
            fi
            local image_tag="${version#v}"
            docker pull "ghcr.io/paperless-ngx/paperless-ngx:${image_tag}"
            set +e
            docker run --rm \
              --entrypoint python3 \
              -e PAPERLESS_SECRET_KEY=changeme \
              -e PAPERLESS_DBENGINE=sqlite \
              "ghcr.io/paperless-ngx/paperless-ngx:${image_tag}" \
              /usr/src/paperless/src/manage.py spectacular \
                --file /dev/stdout --format openapi-json \
              > /tmp/raw-schema.json 2> /tmp/spectacular-stderr.log
            local exit_code=$?
            set -e
            if [ "$exit_code" -ne 0 ]; then
              echo "manage.py spectacular failed with exit code ${exit_code} for ${version}:"
              cat /tmp/spectacular-stderr.log
              exit 1
            fi
            python3 scripts/fix-schema.py --input /tmp/raw-schema.json --output "$out"
            # Keep disk usage bounded — only the small cached JSON schema
            # needs to survive, not the multi-hundred-MB image.
            docker image rm "ghcr.io/paperless-ngx/paperless-ngx:${image_tag}" > /dev/null
          }

          # The tracked schema is already the patched, committed one in the
          # working tree — no need to pull or regenerate it as a diff base.
          prev_schema="/tmp/schema-cache/${TRACKED}.json"
          cp schema/paperless.json "$prev_schema"

          python3 scripts/paperless_versions.py walk \
            --releases /tmp/releases.json --tracked "${TRACKED}" --upstream "${UPSTREAM}" \
            > /tmp/walk.tsv

          while IFS=$'\t' read -r version prev_version; do
            echo "=== ${version} (base: ${prev_version}) ==="
            this_schema="/tmp/schema-cache/${version}.json"
            gen_schema "${version}" "$this_schema"

            python3 -m json.tool "$prev_schema" > /tmp/prev-pretty.json
            python3 -m json.tool "$this_schema" > /tmp/this-pretty.json
            diff -u /tmp/prev-pretty.json /tmp/this-pretty.json > /tmp/schema-diff.txt || true

            if [ ! -s /tmp/schema-diff.txt ]; then
              prev_schema="$this_schema"
              continue
            fi
            echo "Schema changed: ${prev_version} -> ${version}"

            # --state all: a closed-but-unresolved issue (e.g. someone
            # closed it without bumping .paperless-version) still counts as
            # handled — otherwise this would recreate the issue and
            # force-push over its branch every day.
            existing=$(gh issue list --label "schema-drift" --state all --limit 200 --json title \
              --jq "[.[] | select(.title == \"New Paperless-NGX release: ${version}\")] | length")
            if [ "$existing" -gt 0 ]; then
              echo "  issue already exists for ${version}, not regenerating"
              prev_schema="$this_schema"
              continue
            fi

            cp "$this_schema" schema/paperless.json
            echo "${version}" > .paperless-version
            ${OAPI_CODEGEN} --config oapi-codegen.yaml schema/paperless.json

            branch="schema-drift/${version}"
            git checkout -B "$branch" origin/main
            git add schema/paperless.json api/paperless.gen.go .paperless-version
            git commit -m "chore: regenerate client for Paperless-NGX ${version}" \
              -m "Auto-generated by the schema-drift workflow. See the linked issue for the schema diff against the previous tracked release."
            git push origin "$branch" --force
            git checkout main

            VERSION="${version}" PREV_VERSION="${prev_version}" REPO="${REPO}" \
              BRANCH="${branch}" DIFF_FILE=/tmp/schema-diff.txt \
              python3 scripts/build-issue-body.py

            safe_version=$(printf '%s' "${version}" | tr -cd '[:alnum:] ._()-')
            gh issue create \
              --title "New Paperless-NGX release: ${safe_version}" \
              --body-file /tmp/issue-body.md \
              --label "schema-drift"

            prev_schema="$this_schema"
          done < /tmp/walk.tsv

      # if: always() — a run that dies partway through the walk (one bad
      # upstream image, a transient `gh`/docker failure) still keeps
      # whatever it already generated, so tomorrow's run doesn't re-pull it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.versions.outputs.tracked != steps.versions.outputs.upstream
        with:
          path: /tmp/schema-cache
          key: ${{ steps.schema-cache.outputs.cache-primary-key }}
